
name: 盤中大戶即時監控

on:
  schedule:
    # UTC 00:30 = 台灣 08:30
    - cron: '30 0 * * 1-5'
    # 備援排程
    - cron: '50 0 * * 1-5'
  workflow_dispatch:

concurrency:
  group: intraday-monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: 安裝所需套件
        run: pip install -r requirements.txt

      - name: 讓 Telegram 股票名稱直連籌碼K線
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('bot.py')
          code = p.read_text(encoding='utf-8')
          old = 'f"<b>{code} {name}</b> {signal_type}\\n"'
          new = (
              'f\'<a href="https://www.cmoney.tw/finance/{code}/stockmainkline">'
              '<b>{code} {name}</b></a> {signal_type}\\n\''
          )
          count = code.count(old)
          if count != 2:
              raise SystemExit(f'預期找到 2 處 Telegram 股票名稱，實際找到 {count} 處，停止修改以避免誤改')
          p.write_text(code.replace(old, new), encoding='utf-8')
          print('✅ Telegram 股票名稱已加上籌碼K線個股連結（2 處）')
          PY

      - name: 執行盤中循環掃描
        env:
          PYTHONUNBUFFERED: '1'
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_loop.py
